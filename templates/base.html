<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}HireSense AI{% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- Navigation Bar -->

    <nav class="navbar navbar-expand-lg navbar-dark hiresense-navbar">

        <div class="container-fluid px-lg-5">

            <a class="navbar-brand fw-bold fs-3" href="/">
                HireSense<span class="brand-highlight">AI</span>
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#mainNavbar">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-3">

                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>

                    {% if session.get('user') %}

                        <li class="nav-item">
                            <a class="nav-link" href="/candidates">
                                Candidates
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="/dashboard">
                                Dashboard
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="btn btn-outline-light px-4" href="/logout">
                                Logout
                            </a>
                        </li>

                    {% else %}

                        <li class="nav-item">
                            <a class="nav-link" href="/login">
                                Login
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="btn btn-light px-4 fw-semibold"
                               href="/register">
                                Get Started
                            </a>
                        </li>

                    {% endif %}

                </ul>

            </div>

        </div>

    </nav>


    <!-- Main Page Content -->

    <main class="page-content">

        {% block content %}
        {% endblock %}

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
